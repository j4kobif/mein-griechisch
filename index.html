<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Griechisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: kompakte Kopfzeile mit Tab-Leiste, darunter ein Panel je Bereich. Große griechische Schrift ist der Hauptakteur. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface2: #e3e8ee;
  --ink: #13202b;
  --muted: #566574;
  --line: #cbd4dd;
  --accent: #1d5fc0;
  --accent-ink: #ffffff;
  --good: #1e7a46;
  --good-bg: #ddf1e5;
  --bad: #b3362b;
  --bad-bg: #f8e1de;
  --font-gr: 'GFS Didot', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
  --font-ui: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171e;
    --surface: #162430;
    --surface2: #1d2f3d;
    --ink: #e6edf3;
    --muted: #93a6b6;
    --line: #2a3e4e;
    --accent: #6aa6ff;
    --accent-ink: #07121e;
    --good: #5bd18a;
    --good-bg: #15382a;
    --bad: #ff8a7e;
    --bad-bg: #43211e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171e;
  --surface: #162430;
  --surface2: #1d2f3d;
  --ink: #e6edf3;
  --muted: #93a6b6;
  --line: #2a3e4e;
  --accent: #6aa6ff;
  --accent-ink: #07121e;
  --good: #5bd18a;
  --good-bg: #15382a;
  --bad: #ff8a7e;
  --bad-bg: #43211e;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gr { font-family: var(--font-gr); font-weight: 400; }
.wrap { max-width: 760px; margin-inline: auto; padding-inline: 16px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; padding-block: 12px 4px; }
.brand h1 { margin: 0; font-size: 1.7rem; line-height: 1.1; letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 0.9rem; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 4px 8px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 20px 56px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.panel[hidden] { display: none; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; text-wrap: balance; }
h3 { margin: 0; font-size: 1.05rem; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.spk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; }
.spk:hover { background: var(--surface2); }
.spk svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nospeech .spk { display: none; }

/* Start */
.hero { display: flex; flex-direction: column; gap: 8px; }
.hero .big { font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: 1.05; }
.meter { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.prog { display: grid; gap: 14px; }
.prog .head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; margin-bottom: 6px; font-variant-numeric: tabular-nums; }

/* Alphabet */
.detail { display: grid; grid-template-columns: auto 1fr; gap: 16px 24px; align-items: center; }
.detail .glyph { font-size: clamp(3.4rem, 16vw, 5.5rem); line-height: 1; white-space: nowrap; }
.detail .info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.detail .ex { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.grid24 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (min-width: 560px) { .grid24 { grid-template-columns: repeat(6, 1fr); } }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-width: 0; }
.tile .gl { font-size: 1.7rem; line-height: 1.1; }
.tile .nm { font-size: 0.75rem; color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.tile.seen::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 420px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

/* Karten */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.flash { width: 100%; min-height: 220px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.flash:hover { background: var(--surface); border-color: var(--accent); }
.flash .front { font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.2; overflow-wrap: anywhere; }
.flash .tr { font-style: italic; color: var(--muted); font-size: 1.15rem; }
.flash .de { font-size: 1.5rem; font-weight: 600; overflow-wrap: anywhere; }
.flash .hint { color: var(--muted); font-size: 0.85rem; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.boxes { display: flex; gap: 4px; }
.boxes i { width: 18px; height: 6px; border-radius: 3px; background: var(--surface2); }
.boxes i.on { background: var(--accent); }

/* Quiz */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { background: var(--surface2); }
.opt .sub { font-style: italic; color: var(--muted); font-size: 0.9rem; visibility: hidden; }
.opt.ok { background: var(--good-bg); border-color: var(--good); }
.opt.no { background: var(--bad-bg); border-color: var(--bad); }
.answered .opt .sub { visibility: visible; }
.opt:disabled { cursor: default; color: var(--ink); }
.qprompt { font-size: clamp(2rem, 9vw, 3rem); line-height: 1.15; text-align: center; overflow-wrap: anywhere; padding-block: 8px; }
.qprompt.de { font-family: var(--font-ui); font-weight: 700; font-size: clamp(1.5rem, 6vw, 2rem); }
.modes { display: grid; gap: 10px; }
.score { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Grammatik */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
summary { padding: 14px 16px; font-weight: 700; cursor: pointer; list-style-position: inside; }
details[open] summary { border-bottom: 1px solid var(--line); }
details .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.ex-line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.ex-line .gr { font-size: 1.3rem; }
.phrases { display: grid; gap: 8px; }
.phrase { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.phrase > div { min-width: 0; }
.phrase .gr { font-size: 1.25rem; overflow-wrap: anywhere; }
.phrase .tr { font-style: italic; color: var(--muted); font-size: 0.9rem; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width 0.4s ease; } }
</style>
</head>

      exl('Δεν καταλαβαίνω.', 'dhen katalavéno', 'Ich verstehe nicht.') + exl('Δεν ξέρω.', 'dhen xéro', 'Ich weiß nicht.') +
      tbl(['Fragewort', 'Aussprache', 'Bedeutung'], [['τι', 'ti', 'was'], ['πού', 'pu', 'wo'], ['πότε', 'póte', 'wann'], ['πώς', 'pós', 'wie'], ['πόσο', 'póso', 'wie viel'], ['γιατί', 'jatí', 'warum'], ['ποιος', 'pios', 'wer']]) + '</div></details>' +
      '<details><summary>6. Verben auf -ω und der Akkusativ</summary><div class="body">' +
      '<p>Viele Verben enden in der Grundform auf -ω und haben im Präsens dieselben Endungen: -ω, -εις, -ει, -ουμε, -ετε, -ουν.</p>' +
      tbl(['Person', 'θέλω (wollen)', 'Aussprache'], [['ich', 'θέλω', 'thélo'], ['du', 'θέλεις', 'thélis'], ['er, sie, es', 'θέλει', 'théli'], ['wir', 'θέλουμε', 'thélume'], ['ihr, Sie', 'θέλετε', 'thélete'], ['sie (Plural)', 'θέλουν', 'thélun']]) +
      '<p>Nach dem Verb steht das Objekt im Akkusativ. Für den Anfang merkst du dir nur, dass sich der Artikel beim männlichen Wort ändert.</p>' +
      tbl(['Nominativ', 'Akkusativ'], [['ο καφές', 'τον καφέ'], ['η σαλάτα', 'τη σαλάτα'], ['το νερό', 'το νερό']]) +
      exl('Θέλω τον καφέ.', 'thélo ton kafé', 'Ich möchte den Kaffee.') + '</div></details>' +
      '<div class="stack" style="margin-top:8px"><h2>Sätze für unterwegs</h2><p class="muted small">Tippe auf den Lautsprecher, um dir den Satz anzuhören.</p></div>' +
      '<div class="phrases">' + phrases + '</div>';
  };

  /* ---------- Start ---------- */
  renderers.home();
})();
</script>
